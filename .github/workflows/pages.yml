name: Publicar CyoTools TV

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Recoger noticias
        continue-on-error: true
        run: python3 scripts/fetch_news.py --out tv/news.json --previous "${{ steps.pages.outputs.base_url }}/news.json"
      - name: Recoger fondos de pantalla
        continue-on-error: true
        run: python3 scripts/fetch_wallpapers.py --out tv/wallpapers.json --previous "${{ steps.pages.outputs.base_url }}/wallpapers.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tv
      - id: deployment
        uses: actions/deploy-pages@v4
